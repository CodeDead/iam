[package]
name = "auth-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "Secure User, Role & Permission Management System REST API"

[features]
default = []
test-utils = []

[dependencies]
actix-cors = "0.7"
actix-web = "4"
argon2 = "0.6"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
config = "0.15"
dotenvy = "0.15"
ed25519-dalek = { version = "3", features = ["pkcs8", "pem", "rand_core"] }
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
mongodb = "3"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "6", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web", "vendored"] }
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
auth-backend = { path = ".", features = ["test-utils"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
