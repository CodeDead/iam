server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.inc;

    location = /healthz {
        access_log off;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable" always;
    }

    # Never serve index.html with 200 OK for /api/* if the reverse proxy falls back here when backend is offline.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        default_type application/json;
        return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"The API server is currently unavailable. Please try again shortly."}}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
