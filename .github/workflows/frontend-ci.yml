name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: ESLint, Prettier & Stack Constraints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify JavaScript-only & no TanStack dependencies
        working-directory: .
        run: |
          TS_FILES=$(find frontend/src \( -name '*.ts' -o -name '*.tsx' \))
          if [ -n "$TS_FILES" ]; then
            echo "Forbidden TypeScript files detected:"
            echo "$TS_FILES"
            exit 1
          fi
          if grep -qi 'tanstack' frontend/package.json; then
            echo "Forbidden TanStack dependency detected in frontend/package.json"
            exit 1
          fi

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Cache Yarn Berry dependencies
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.19.0.cjs install --immutable

      - name: Check formatting (Prettier)
        run: node .yarn/releases/yarn-4.19.0.cjs format:check

      - name: Lint (ESLint)
        run: node .yarn/releases/yarn-4.19.0.cjs lint --max-warnings=0

  test-and-build:
    name: Vitest & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Cache Yarn Berry dependencies
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.19.0.cjs install --immutable

      - name: Run tests (Vitest)
        run: node .yarn/releases/yarn-4.19.0.cjs test

      - name: Verify production build (Vite)
        run: node .yarn/releases/yarn-4.19.0.cjs build
