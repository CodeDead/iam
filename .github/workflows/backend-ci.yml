name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-format:
    name: Format, Clippy & Module Conventions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify no mod.rs files exist
        working-directory: .
        run: |
          MOD_FILES=$(find backend/src -name 'mod.rs')
          if [ -n "$MOD_FILES" ]; then
            echo "Forbidden mod.rs files detected:"
            echo "$MOD_FILES"
            exit 1
          fi

      - name: Install Rust 1.100.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Unit, API & MongoDB Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start MongoDB 9 single-node replica set (rs0)
        working-directory: .
        run: |
          docker run -d --name ci-mongodb -p 127.0.0.1:27017:27017 mongo:9 mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec ci-mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec ci-mongodb mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          for i in $(seq 1 30); do
            if docker exec ci-mongodb mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set failed to elect primary"
          exit 1

      - name: Install Rust 1.100.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Run unit, API, RBAC, and MongoDB integration tests
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: cargo test --locked -- --nocapture

      - name: Stop MongoDB container
        if: always()
        working-directory: .
        run: docker rm -f ci-mongodb || true
